AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Persistent storage for Pokerdot application

Parameters:
  Stage:
    Type: String
    Description: Stage name - must match the name of a GitHub environment (e.g. test, prod)
  GitHubOIDCProviderArn:
    Type: String
    Description: ARN of the GitHub OIDC identity provider in this account
  GitHubOrg:
    Type: String
    Default: adamnfish
    Description: GitHub organisation or username for CI/CD (e.g. adamnfish)
  GitHubRepo:
    Type: String
    Default: pokerdot
    Description: GitHub repository name for CI/CD (e.g. pokerdot)
  DistBucket:
    Type: String
    Description: Name of the S3 bucket that holds API build artifacts (to scope OIDC access for CI/CD)

Resources:
  WebrootAccessIdentityID:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: Pokerdot webroot CDN access

  # Bucket that will hold the public static assets.
  # The application will be served out of this bucket using CloudFront
  WebrootBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pokerdot-www-${Stage}-${AWS::AccountId}"
      Tags:
        - Key: "app"
          Value: "pokerdot"
        - Key: "stage"
          Value: !Ref Stage
        - Key: "resource"
          Value: "webroot"

  WebrootBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebrootBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${WebrootBucket}/*"
            Principal:
              AWS: !Sub "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${WebrootAccessIdentityID}"

  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "pokerdot-games-${Stage}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: True
      TimeToLiveSpecification:
        AttributeName: "expiry"
        Enabled: true
      AttributeDefinitions:
        - AttributeName: "gameCode"
          AttributeType: "S"
        - AttributeName: "gameId"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "gameCode"
          KeyType: "HASH"
        - AttributeName: "gameId"
          KeyType: "RANGE"
      Tags:
        - Key: "app"
          Value: "pokerdot"
        - Key: "stage"
          Value: !Ref Stage
        - Key: "resource"
          Value: "games"

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "pokerdot-players-${Stage}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: True
      TimeToLiveSpecification:
        AttributeName: "expiry"
        Enabled: true
      AttributeDefinitions:
        - AttributeName: "gameId"
          AttributeType: "S"
        - AttributeName: "playerId"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "gameId"
          KeyType: "HASH"
        - AttributeName: "playerId"
          KeyType: "RANGE"
      Tags:
        - Key: "app"
          Value: "pokerdot"
        - Key: "stage"
          Value: !Ref Stage
        - Key: "resource"
          Value: "players"

  # GitHub Actions OIDC role for CI/CD deployments
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "pokerdot-gha-deploy-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: pokerdot-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Discover resources by tag
              - Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"
              # Upload lambda artifact to dist bucket
              - Effect: Allow
                Action:
                  - s3:GetObject # for the lambda:update-function command
                  - s3:PutObject # for saving the lambda artifact to the dist bucket
                Resource: !Sub "arn:aws:s3:::${DistBucket}/pokerdot/${Stage}/*"
              # Sync frontend assets to webroot bucket
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${WebrootBucket}"
                  - !Sub "arn:aws:s3:::${WebrootBucket}/*"
              # Update lambda function code
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunctionConfiguration
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/app: pokerdot
                    aws:ResourceTag/stage: !Ref Stage
                    aws:ResourceTag/resource: backend
              # Invalidate CloudFront distribution
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
      Tags:
        - Key: "app"
          Value: "pokerdot"
        - Key: "stage"
          Value: !Ref Stage


Outputs:
  WebrootAccessIdentityID:
    Description: "Webroot access identity ID"
    Value: !Ref WebrootAccessIdentityID

  GamesTableName:
    Description: "Games table name"
    Value: !Ref GamesTable

  PlayersTableName:
    Description: "Players table name"
    Value: !Ref PlayersTable

  WebrootBucketName:
    Description: "Webroot bucket's name"
    Value: !Ref WebrootBucket

  GitHubActionsRoleArn:
    Description: "ARN of the GitHub Actions deployment role (use in GHA workflow)"
    Value: !GetAtt GitHubActionsRole.Arn